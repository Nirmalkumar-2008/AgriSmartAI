    tailwind.config = {

            brand: {
              navy: '#071426',

  <style>

    .glass-card {
      backdrop-filter: blur(12px);

    .text-gradient-emerald {

<body class="bg-[#071426] text-slate-100 min-h-screen antialiased selection:bg-emerald-500 selection:text-slate-950 transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ==========================================================================
    // ERROR BOUNDARY COMPONENT
    // ==========================================================================
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }

      componentDidCatch(error, errorInfo) {
        console.error("AgriSmartAI Component Error:", error, errorInfo);
      }

      render() {
        if (this.state.hasError) {
          return (
            <div className="max-w-4xl mx-auto my-12 p-8 glass-card bg-white/90 dark:bg-[#0b1d33]/90 text-slate-900 dark:text-white rounded-3xl border border-red-500/30 text-center space-y-4 shadow-xl">
              <span className="text-4xl block">⚠️</span>
              <h2 className="text-2xl font-bold font-display">Section Load Error</h2>
              <p className="text-slate-600 dark:text-slate-300 text-xs sm:text-sm">
                An unexpected error occurred while displaying this section. Technical log has been saved.
              </p>
              <button
                onClick={() => this.setState({ hasError: false, error: null })}
                className="px-6 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl text-xs transition cursor-pointer"
              >
                ↻ Retry Section
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // ==========================================================================
    // 1. GLOBAL NAVBAR COMPONENT
    // ==========================================================================

      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      const navItems = [
        { id: 'home', label: 'Home', icon: '🏠' },
        { id: 'guide', label: 'User Guide', icon: '📖' },
        { id: 'predict', label: 'Crop Advisory', icon: '🌱' },
        { id: 'history', label: 'Prediction History', icon: '📜' },
        { id: 'dashboard', label: 'Dashboard', icon: '📊' },
        { id: 'about', label: 'About Platform', icon: '📘' },
        { id: 'contact', label: 'Contact', icon: '📞' }
      ];

      return (
        <header className="sticky top-0 z-50 glass-card bg-white/95 dark:bg-[#071426]/95 border-b border-slate-200 dark:border-slate-800 shadow-sm backdrop-blur-md transition-colors duration-300">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">

            {/* BRANDING LOGO */}
            <div className="flex items-center space-x-3 cursor-pointer shrink-0" onClick={() => setActiveTab('home')}>
              <div className="w-9 h-9 rounded-2xl bg-emerald-600 dark:bg-emerald-500 flex items-center justify-center text-white text-lg shadow-md shadow-emerald-500/20">
                🌱
              </div>
              <div>
                <span className="text-lg sm:text-xl font-display font-extrabold tracking-tight text-slate-900 dark:text-white">AgriSmart<span className="text-emerald-500">AI</span></span>

              </div>
            </div>

            {/* DESKTOP NAV (CENTERED) */}

              {navItems.map((item) => (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center space-x-1.5 cursor-pointer ${

            {/* RIGHT UTILITIES: THEME TOGGLE & HEALTH STATUS */}

                  <div className="flex items-center justify-between text-xs text-slate-400 pt-1 border-t border-slate-800">

            </div>
          </div>

          {/* PERFORMANCE / MODEL STATISTICS STRIP */}

            <div className="grid grid-cols-2 md:grid-cols-4 gap-6 text-center">

              {/* CARD 1 */}

                  <div className="w-12 h-12 rounded-2xl bg-emerald-500/10 text-emerald-500 flex items-center justify-center text-2xl border border-emerald-500/20">

      const [weatherError, setWeatherError] = useState(null);

      const [soilData, setSoilData] = useState({
        N: '90',
        P: '42',
        K: '43',
        ph: '6.5',
        soil_moisture: '45'
      });

      const [validationErrors, setValidationErrors] = useState({});
      const [selectedCrop, setSelectedCrop] = useState('');
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [apiError, setApiError] = useState(null);
      const [advisoryResult, setAdvisoryResult] = useState(null);
      const [saveSuccess, setSaveSuccess] = useState(false);

      const SUPPORTED_CROPS = [
        "rice", "maize", "chickpea", "kidneybeans", "pigeonpeas", "mothbeans",
        "mungbean", "blackgram", "lentil", "pomegranate", "banana", "mango",
        "grapes", "watermelon", "muskmelon", "apple", "orange", "papaya",
        "coconut", "cotton", "jute", "coffee", "wheat"
      ];

      useEffect(() => {
        fetch('/health')
          .then(res => res.json())
          .then(data => setHealthStatus(data))
          .catch(() => setHealthStatus({ status: 'degraded', models_loaded: false }));

        handleFetchWeather('Bengaluru');
      }, []);

      const handleFetchWeather = (targetCity) => {
        const queryCity = targetCity || city;
        if (!queryCity || queryCity.trim() === '') {
          setWeatherError('Please enter a city or region name.');
          return;
        }

        setLoadingWeather(true);
        setWeatherError(null);

        fetch(`/weather/${encodeURIComponent(queryCity.trim())}`)
          .then(res => {
            if (!res.ok) throw new Error('Weather fetch failed');
            return res.json();
          })
          .then(data => {
            setWeatherData(data);
            setLoadingWeather(false);
          })
          .catch(() => {
            setWeatherError('Unable to fetch weather data. Please check the city name or try again.');
            setLoadingWeather(false);
          });
      };

      const handleSoilChange = (field, value) => {
        setSoilData(prev => ({ ...prev, [field]: value }));
        if (validationErrors[field]) {
          setValidationErrors(prev => ({ ...prev, [field]: null }));
        }
      };

      const validateInputs = () => {
        const errors = {};
        if (!city || city.trim() === '') {
          errors.city = 'Please enter a city or region name.';
        }

        const nVal = parseFloat(soilData.N);
        if (isNaN(nVal) || nVal < 0) {
          errors.N = 'Please enter a valid Nitrogen level (N >= 0).';
        }

        const pVal = parseFloat(soilData.P);
        if (isNaN(pVal) || pVal < 0) {
          errors.P = 'Please enter a valid Phosphorus level (P >= 0).';
        }

        const kVal = parseFloat(soilData.K);
        if (isNaN(kVal) || kVal < 0) {
          errors.K = 'Please enter a valid Potassium level (K >= 0).';
        }

        const phVal = parseFloat(soilData.ph);
        if (isNaN(phVal) || phVal < 0 || phVal > 14) {
          errors.ph = 'Please enter a valid soil pH between 0 and 14.';
        }

        const mVal = parseFloat(soilData.soil_moisture);
        if (isNaN(mVal) || mVal < 0 || mVal > 100) {
          errors.soil_moisture = 'Please enter soil moisture between 0 and 100%.';
        }

        setValidationErrors(errors);
        return Object.keys(errors).length === 0;
      };

      const executeAdvisoryCalculation = (overrideCrop) => {
        if (!validateInputs()) return;

        setIsAnalyzing(true);
        setApiError(null);

        const targetCropVal = overrideCrop !== undefined ? overrideCrop : selectedCrop;

        const payload = {
          city: city.trim(),
          N: parseFloat(soilData.N),
          P: parseFloat(soilData.P),
          K: parseFloat(soilData.K),
          ph: parseFloat(soilData.ph),
          soil_moisture: parseFloat(soilData.soil_moisture),
          selected_crop: targetCropVal || undefined
        };

        if (weatherData) {
          payload.temperature = weatherData.temperature;
          payload.humidity = weatherData.humidity;
          payload.rainfall = weatherData.rainfall;
        }

        fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
          .then(res => {
            if (!res.ok) {
              return res.json().then(errData => {
                throw new Error(errData.detail || 'Prediction request failed');
              });
            }
            return res.json();
          })
          .then(data => {
            setAdvisoryResult(data);
            setIsAnalyzing(false);
            fetch('/prediction-history')
              .then(r => r.json())
              .then(h => {
                const list = (h && Array.isArray(h.history)) ? h.history : (Array.isArray(h) ? h : []);
                if (list.length > 0) {
                  localStorage.setItem('agri_history', JSON.stringify(list));
                }
              })
              .catch(() => {});
          })
          .catch(err => {
            setApiError(err.message || 'An unexpected error occurred during prediction.');
            setIsAnalyzing(false);
          });
      };

      const handleSelectYieldCrop = (e) => {
        const val = e.target.value;
        setSelectedCrop(val);
        if (advisoryResult) {
          executeAdvisoryCalculation(val);
        }
      };

      const handleSaveAdvisory = () => {
        if (!advisoryResult) return;

        const record = {
          id: Date.now(),
          timestamp: new Date().toLocaleString(),
          city: city,
          weather: weatherData,
          soil: soilData,
          recommended_crop: advisoryResult.recommended_crops ? advisoryResult.recommended_crops[0].crop : advisoryResult.recommended_crop,
          selected_crop: advisoryResult.selected_crop,
          predicted_yield: advisoryResult.predicted_yield_tons_per_ha,
          fertilizer: advisoryResult.fertilizer_recommendation,
          irrigation: advisoryResult.irrigation_recommendation,
          alerts_count: advisoryResult.agricultural_insights ? advisoryResult.agricultural_insights.length : 0
        };

        const existing = JSON.parse(localStorage.getItem('agri_history') || '[]');
        localStorage.setItem('agri_history', JSON.stringify([record, ...existing]));
        setSaveSuccess(true);
        setTimeout(() => setSaveSuccess(false), 3000);
      };

      const handleReset = () => {
        setCity('Bengaluru');
        setSoilData({ N: '90', P: '42', K: '43', ph: '6.5', soil_moisture: '45' });
        setSelectedCrop('');
        setAdvisoryResult(null);
        setValidationErrors({});
        setApiError(null);
        setWeatherError(null);
        handleFetchWeather('Bengaluru');
      };

      const getYieldQualityCategory = (val) => {
        if (val === null || val === undefined) return null;
        if (val >= 7.0) return { label: 'Excellent Yield', color: 'text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/60 border-emerald-500/30' };
        if (val >= 4.0) return { label: 'Good Yield', color: 'text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-950/60 border-blue-500/30' };
        if (val >= 2.0) return { label: 'Moderate Yield', color: 'text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-950/60 border-amber-500/30' };
        return { label: 'Low Yield', color: 'text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-950/60 border-red-500/30' };
      };

              <div className="inline-flex items-center space-x-2 bg-emerald-500/10 dark:bg-emerald-500/20 px-3 py-1 rounded-full border border-emerald-500/30 text-xs font-bold text-emerald-600 dark:text-emerald-300">
                <span>🌱 CROP ADVISORY MODULE</span>
              </div>

    const ContactPage = ({ onNav }) => {

      const [emailSent, setEmailSent] = useState(false);
      const [isSending, setIsSending] = useState(false);
      const [errors, setErrors] = useState({});
      const [submitError, setSubmitError] = useState(null);
      const [feedbackHistory, setFeedbackHistory] = useState([]);

      const fetchHistory = () => {
        fetch('/feedback')
          .then(res => res.json())
          .then(data => {
            if (Array.isArray(data)) setFeedbackHistory(data);
          })
          .catch(() => {});
      };

      useEffect(() => {
        fetchHistory();
      }, [submitted]);

      const handleSubmit = (e) => {
        e.preventDefault();
        setSubmitError(null);
        const errs = {};

        if (!formData.name.trim()) errs.name = "Name is required";
        if (!formData.email.trim() || !formData.email.includes('@') || !formData.email.includes('.')) errs.email = "Valid email address is required";
        if (!formData.subject.trim()) errs.subject = "Subject is required";
        if (!formData.message.trim()) errs.message = "Message is required";

        setErrors(errs);
        if (Object.keys(errs).length === 0) {
          setIsSending(true);
          fetch('/feedback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
          })
            .then(res => {
              if (!res.ok) throw new Error("Unable to send your message right now. Please try again.");
              return res.json();
            })
            .then(data => {
              setIsSending(false);
              setSubmitted(true);
              setEmailSent(Boolean(data.email_sent));
              setFormData({ name: '', email: '', subject: '', category: 'General Feedback', message: '' });
              fetchHistory();
            })
            .catch(err => {
              setIsSending(false);
              setSubmitError("Unable to send your message right now. Please try again.");
            });
        }
      };

      return (
        <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-10 animate-fadeIn transition-colors duration-300 text-slate-900 dark:text-slate-100">
          
          <div className="text-center space-y-3">
            <div className="inline-flex items-center space-x-2 bg-emerald-500/10 dark:bg-emerald-500/20 px-4 py-1.5 rounded-full border border-emerald-500/30 text-xs font-bold text-emerald-600 dark:text-emerald-300">
              <span>📞 PLATFORM SUPPORT & FEEDBACK</span>
            </div>
            <h1 className="text-3xl sm:text-4xl font-black font-display text-slate-900 dark:text-white">
              Contact AgriSmartAI
            </h1>
            <p className="text-slate-600 dark:text-slate-300 text-xs sm:text-sm max-w-2xl mx-auto leading-relaxed">
              Submit your platform feedback, bug reports, or feature enquiries below. Notifications are sent directly to <code>agrismart.off@gmail.com</code>.
            </p>
          </div>

          <div className="glass-card bg-white/95 dark:bg-[#0b1d33]/90 p-8 rounded-3xl border border-slate-200 dark:border-slate-800 space-y-6 shadow-sm">
            <h2 className="text-2xl font-bold font-display text-slate-900 dark:text-white">Send Platform Message</h2>
            
            {submitError && (
              <div className="p-4 bg-rose-50 dark:bg-rose-950/60 border border-rose-200 dark:border-rose-500/40 rounded-2xl text-rose-700 dark:text-rose-300 text-xs font-medium">
                ⚠️ {submitError}
              </div>
            )}

            {submitted ? (
              <div className="p-6 bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-500/40 rounded-2xl text-center space-y-3">
                <span className="text-3xl block text-emerald-500">✓</span>
                {emailSent ? (
                  <>
                    <h3 className="text-lg font-bold text-slate-900 dark:text-white">✓ Feedback submitted successfully and notification email sent.</h3>
                    <p className="text-xs text-slate-600 dark:text-slate-300">
                      Your message has been delivered to <code>agrismart.off@gmail.com</code> and saved to the platform database.
                    </p>
                  </>
                ) : (
                  <>
                    <h3 className="text-lg font-bold text-slate-900 dark:text-white">✓ Feedback saved successfully.</h3>
                    <p className="text-xs text-amber-600 dark:text-amber-400 font-semibold">
                      ⚠️ Email notification could not be sent. (Configure <code>SMTP_PASSWORD</code> in <code>.env</code> with a valid Gmail App Password).
                    </p>
                  </>
                )}
                <button
                  onClick={() => setSubmitted(false)}
                  className="px-5 py-2 bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs cursor-pointer hover:bg-emerald-400 transition"
                >
                  Send Another Message
                </button>
              </div>
            ) : (
              <form onSubmit={handleSubmit} className="space-y-4 text-xs">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="space-y-1">
                    <label className="block text-slate-700 dark:text-slate-300 font-semibold">Your Name</label>
                    <input
                      type="text"
                      value={formData.name}
                      onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                      placeholder="Enter your name"
                      className="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700/80 rounded-xl text-slate-900 dark:text-white focus:outline-none focus:border-emerald-500 text-xs"
                    />
                    {errors.name && <p className="text-red-500 text-[11px]">{errors.name}</p>}
                  </div>

                  <div className="space-y-1">
                    <label className="block text-slate-700 dark:text-slate-300 font-semibold">Your Email</label>
                    <input
                      type="email"
                      value={formData.email}
                      onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                      placeholder="Enter email address"
                      className="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700/80 rounded-xl text-slate-900 dark:text-white focus:outline-none focus:border-emerald-500 text-xs"
                    />
                    {errors.email && <p className="text-red-500 text-[11px]">{errors.email}</p>}
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="space-y-1">
                    <label className="block text-slate-700 dark:text-slate-300 font-semibold">Subject</label>
                    <input
                      type="text"
                      value={formData.subject}
                      onChange={(e) => setFormData({ ...formData, subject: e.target.value })}
                      placeholder="Enter message subject"
                      className="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700/80 rounded-xl text-slate-900 dark:text-white focus:outline-none focus:border-emerald-500 text-xs"
                    />
                    {errors.subject && <p className="text-red-500 text-[11px]">{errors.subject}</p>}
                  </div>

                  <div className="space-y-1">
                    <label className="block text-slate-700 dark:text-slate-300 font-semibold">Feedback Category</label>
                    <select
                      value={formData.category}
                      onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                      className="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700/80 rounded-xl text-slate-900 dark:text-white focus:outline-none focus:border-emerald-500 text-xs cursor-pointer"
                    >
                      <option value="UI / UX">UI / UX</option>
                      <option value="Prediction Accuracy">Prediction Accuracy</option>
                      <option value="Weather Integration">Weather Integration</option>
                      <option value="Agricultural Recommendation">Agricultural Recommendation</option>
                      <option value="General Feedback">General Feedback</option>
                    </select>
                  </div>
                </div>

                <div className="space-y-1">
                  <label className="block text-slate-700 dark:text-slate-300 font-semibold">Message</label>
                  <textarea
                    rows="4"
                    value={formData.message}
                    onChange={(e) => setFormData({ ...formData, message: e.target.value })}
                    placeholder="Type your message here..."
                    className="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700/80 rounded-xl text-slate-900 dark:text-white focus:outline-none focus:border-emerald-500 text-xs"
                  ></textarea>
                  {errors.message && <p className="text-red-500 text-[11px]">{errors.message}</p>}
                </div>

                <button
                  type="submit"
                  disabled={isSending}
                  className="px-6 py-3 bg-emerald-500 hover:bg-emerald-400 disabled:bg-slate-400 text-slate-950 font-bold rounded-2xl text-xs transition shadow-lg cursor-pointer flex items-center space-x-2"
                >
                  {isSending ? (
                    <>
                      <span className="w-3.5 h-3.5 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></span>
                      <span>Sending...</span>
                    </>
                  ) : (
                    <span>Send Message →</span>
                  )}
                </button>
              </form>
            )}
          </div>

          {/* SUBMITTED MESSAGES AUDIT SECTION */}
          {feedbackHistory.length > 0 && (
            <div className="glass-card bg-white/95 dark:bg-[#0b1d33]/90 p-8 rounded-3xl border border-slate-200 dark:border-slate-800 space-y-4 shadow-sm">
              <h3 className="text-lg font-bold font-display text-slate-900 dark:text-white flex items-center gap-2">
                <span>📁</span>
                <span>Submitted Platform Feedback Log ({feedbackHistory.length})</span>
              </h3>

              <div className="space-y-3 max-h-80 overflow-y-auto pr-1">
                {feedbackHistory.map((item) => (
                  <div key={item.id} className="p-4 bg-slate-50 dark:bg-slate-950 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-1 text-xs">
                    <div className="flex justify-between items-center text-slate-500 dark:text-slate-400 text-[11px]">
                      <span><strong className="text-slate-900 dark:text-white">{item.name}</strong> ({item.email})</span>
                      <span className="font-mono">{item.timestamp}</span>
                    </div>
                    <div className="flex items-center gap-2 font-bold text-emerald-600 dark:text-emerald-400">
                      <span className="px-2 py-0.5 bg-emerald-500/10 rounded border border-emerald-500/20 text-[10px]">{item.category}</span>
                      <span>{item.subject}</span>
                    </div>
                    <p className="text-slate-600 dark:text-slate-300 text-[11px] pt-1">{item.message}</p>
                  </div>
                ))}
              </div>
            </div>
          )}

        </div>
      );
    };

    // ==========================================================================
    // MAIN APP COMPONENT
    // ==========================================================================
    const App = () => {
      const [activeTab, setActiveTab] = useState('home');
      const [healthStatus, setHealthStatus] = useState('healthy');
      const [theme, setTheme] = useState(() => localStorage.getItem('agri_theme') || 'dark');

      useEffect(() => {
        localStorage.setItem('agri_theme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
          document.body.className = 'bg-[#071426] text-slate-100 min-h-screen antialiased selection:bg-emerald-500 selection:text-slate-950 transition-colors duration-300';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
          document.body.className = 'bg-[#F8FAFC] text-slate-900 min-h-screen antialiased selection:bg-emerald-500 selection:text-slate-950 transition-colors duration-300';
        }
      }, [theme]);

      useEffect(() => {
        fetch('/health')
          .then(res => res.json())
          .then(data => setHealthStatus(data.status || 'healthy'))
          .catch(() => setHealthStatus('degraded'));
      }, []);

      const toggleTheme = () => {
        setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));
      };

      return (
        <div className="min-h-screen flex flex-col justify-between transition-colors duration-300">
          <div>
            <Navbar
              activeTab={activeTab}
              setActiveTab={setActiveTab}
              healthStatus={healthStatus}
              theme={theme}
              onToggleTheme={toggleTheme}
            />

            <ErrorBoundary>
              {activeTab === 'home' && <HomePage onStart={() => setActiveTab('predict')} onNav={setActiveTab} />}
              {activeTab === 'predict' && <PredictPage onNav={setActiveTab} />}
              {activeTab === 'dashboard' && <DashboardPage onNav={setActiveTab} />}
              {activeTab === 'history' && <HistoryPage onNav={setActiveTab} />}
              {activeTab === 'about' && <AboutPage />}
              {activeTab === 'guide' && <GuidePage onStart={() => setActiveTab('predict')} onNav={setActiveTab} />}
              {activeTab === 'contact' && <ContactPage onNav={setActiveTab} />}
            </ErrorBoundary>
          </div>

          <footer className="glass-card bg-white/95 dark:bg-[#071426]/95 border-t border-slate-200 dark:border-slate-800 py-8 px-4 text-xs transition-colors duration-300 shadow-sm">
            <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8 pb-6 border-b border-slate-200 dark:border-slate-800">
              
              {/* LEFT */}
              <div className="space-y-2">
                <div className="flex items-center space-x-2">
                  <span className="text-xl">🌱</span>
                  <span className="font-display font-extrabold text-slate-900 dark:text-white text-lg tracking-tight">AgriSmart<span className="text-emerald-500">AI</span></span>
                </div>
                <p className="text-slate-600 dark:text-slate-400 text-xs leading-relaxed max-w-sm">
                  Precision Agriculture Decision Support Platform
                </p>
              </div>

              {/* MIDDLE */}
              <div className="space-y-2">
                <h4 className="font-bold text-slate-900 dark:text-white uppercase tracking-wider text-[11px]">Quick Links</h4>
                <div className="grid grid-cols-2 gap-1 text-slate-600 dark:text-slate-400">
                  <button onClick={() => setActiveTab('home')} className="text-left hover:text-emerald-500 transition cursor-pointer">Home</button>
                  <button onClick={() => setActiveTab('guide')} className="text-left hover:text-emerald-500 transition cursor-pointer">User Guide</button>
                  <button onClick={() => setActiveTab('predict')} className="text-left hover:text-emerald-500 transition cursor-pointer">Crop Advisory</button>
                  <button onClick={() => setActiveTab('history')} className="text-left hover:text-emerald-500 transition cursor-pointer">Prediction History</button>
                  <button onClick={() => setActiveTab('dashboard')} className="text-left hover:text-emerald-500 transition cursor-pointer">Dashboard</button>
                  <button onClick={() => setActiveTab('about')} className="text-left hover:text-emerald-500 transition cursor-pointer">About Platform</button>
                  <button onClick={() => setActiveTab('contact')} className="text-left hover:text-emerald-500 transition cursor-pointer">Contact</button>
                </div>
              </div>

              {/* RIGHT */}
              <div className="space-y-2">
                <h4 className="font-bold text-slate-900 dark:text-white uppercase tracking-wider text-[11px]">Platform Modules</h4>
                <ul className="space-y-1 text-slate-600 dark:text-slate-400 text-xs">
                  <li>🌱 Crop Recommendation</li>
                  <li>🌾 Crop Yield Prediction</li>
                  <li>🧪 Fertilizer Optimization</li>
                  <li>💧 Smart Irrigation Scheduling</li>
                  <li>🔍 Explainable AI (SHAP)</li>
                </ul>
              </div>

            </div>

            <div className="max-w-7xl mx-auto pt-6 text-center space-y-1 text-slate-500 dark:text-slate-400 text-[11px]">
              <div>© 2026 AgriSmartAI — Precision Agriculture Decision Support Platform</div>
              <div className="text-[10px] text-slate-400 dark:text-slate-500 font-mono">
                "An Intelligent Machine Learning-Based Decision Support System for Crop Recommendation, Yield Prediction, Fertilizer Optimization, and Smart Irrigation Management"
              </div>
            </div>
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
